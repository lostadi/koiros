name: Build and verify APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17.0.13+11'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.8'
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run model tests and compare two clean APK builds
        run: python3 tools/verify_reproducible.py --out dist/reproducibility
      - name: Save unsigned APK and verification artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koiros-unsigned-${{ github.sha }}
          path: |
            dist/reproducibility/first/Koiros-*-unsigned.apk
            dist/reproducibility/first/build-metadata.json
            dist/reproducibility/reproducibility.json
          if-no-files-found: error
          retention-days: 30
